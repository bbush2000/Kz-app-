# Future AGP rebuilds must not strip 16 KB page alignment.
# scripts/build-apk.sh is the real pipeline (aapt2 + d8, not Gradle).
# AGP 8.5.1+ aligns uncompressed jniLibs to 16 KB when useLegacyPackaging is false.
android.bundle.enableUncompressedNativeLibs=true
android.experimental.enableNativeLibraryPageSize16KB=true
